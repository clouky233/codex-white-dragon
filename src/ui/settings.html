<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'"><title>Codex 白龙 · 设置与记录</title><link rel="stylesheet" href="settings.css"></head><body>
<header><div class="mark">✦</div><div><span class="kicker">WHITE DRAGON / CODEX</span><h1>额度有数，安心做事。</h1><p>真实订阅额度 · 桌面陪伴 · 本地记录</p></div><button id="show">显示白龙 ↗</button></header>
<main><section class="account panel"><div class="section-head"><h2>当前连接</h2><button id="refresh">刷新额度 ↻</button></div><div id="connection" class="connection">正在读取…</div><div id="quota-list" class="quota-list"></div><p id="diagnostic" class="subtle"></p></section>
<div class="columns"><section class="panel"><div class="section-head"><h2>白龙的样子</h2><span class="pill">外观</span></div><label>大小 <output id="scale-value"></output><input id="scale" type="range" min="0.65" max="1.4" step="0.05"></label><label class="check"><input id="alwaysOnTop" type="checkbox">始终置顶</label><label class="check"><input id="flip" type="checkbox">水平翻转</label><label class="check"><input id="reducedMotion" type="checkbox">减少动态效果</label><label class="color-label">强调色 <input id="accent" type="color"></label><p class="subtle">拖动角色移动，靠近屏幕边缘自动吸附；位置会保存在本机。</p></section>
<section class="panel"><div class="section-head"><h2>温柔提醒</h2><span class="pill">通知</span></div><label class="check"><input id="sound" type="checkbox">完成提示音</label><label>音量 <output id="volume-value"></output><input id="volume" type="range" min="0" max="1" step="0.05"></label><label>低额度提醒 <output id="lowThreshold-value"></output><input id="lowThreshold" type="range" min="1" max="50" step="1"></label><label>通知气泡停留 <output id="noticeSeconds-value"></output><input id="noticeSeconds" type="range" min="3" max="60" step="1"></label><label class="check"><input id="nativeNotifications" type="checkbox">同时显示 Windows 通知</label><button class="secondary" id="test-notice">预览气泡与提示音</button></section></div>
<section class="panel"><div class="section-head"><h2>本次运行的额度轨迹</h2><span class="pill">剩余百分比</span></div><canvas id="trend" width="740" height="130" aria-label="本次运行的订阅额度走势"></canvas><p id="trend-note" class="subtle"></p></section>
<section class="panel"><div class="section-head"><h2>完成记录</h2><button id="clear-history">清空本地记录</button></div><p id="monitor-status" class="subtle"></p><div id="history"></div></section>
<footer>v0.1.2 · 独立桌面挂件<br>首版尚未接入原窗口跟随、问题/审批等待识别、音频裁剪与自定义素材导入。六种静态表情配合轻动效，后续继续完善。<br><span id="save-state">设置自动保存</span><button id="quit">退出白龙</button></footer></main><script src="settings.js"></script></body></html>
